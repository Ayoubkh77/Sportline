<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${categorie.id != null} ? 'Modifier Catégorie' : 'Ajouter Catégorie'">Catégorie</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-4">
    <h1 th:text="${categorie.id != null} ? 'Modifier Catégorie' : 'Ajouter Catégorie'"></h1>

    <form th:action="@{/Sportline/admin/categorie/save}" th:object="${categorie}" method="post">
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Nom</label>
            <input type="text" class="form-control" th:field="*{nom}" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
        </div>

        <button type="submit" class="btn btn-success">Enregistrer</button>
        <a href="/Sportline/admin/categorie" class="btn btn-secondary">Annuler</a>
    </form>
</div>

</body>
</html>
