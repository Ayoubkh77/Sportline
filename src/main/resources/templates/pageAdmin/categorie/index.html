<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catégories - Admin</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-4">
    <h1>Gestion des Catégories</h1>

    <a href="/Sportline/admin/categorie/ajouter" class="btn btn-success mb-3">Ajouter une catégorie</a>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nom</th>
            <th>Description</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="cat : ${categories}">
            <td th:text="${cat.id}"></td>
            <td th:text="${cat.nom}"></td>
            <td th:text="${cat.description}"></td>
            <td>
                <a th:href="@{'/Sportline/admin/categorie/edit/' + ${cat.id}}" class="btn btn-primary btn-sm">Modifier</a>
                <a th:href="@{'/Sportline/admin/categorie/delete/' + ${cat.id}}" class="btn btn-danger btn-sm"
                   onclick="return confirm('Voulez-vous vraiment supprimer cette catégorie ?');">Supprimer</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
