<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon profil - Sportline</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/Sportline">Sportline</a>
        <div>
            <a href="/Sportline/logout" class="btn btn-outline-light">Déconnexion</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h2 class="mb-4">Mon Compte</h2>

    <div class="row">

        <!-- Informations personnelles -->
        <div class="col-md-4">
            <div class="card shadow-sm mb-3">
                <div class="card-body">
                    <h5 class="card-title">Informations personnelles</h5>

                    <p><strong>Nom :</strong> <span th:text="${#authentication.principal.username}">Nom</span></p>
                    <p><strong>Email :</strong> <span th:text="${#authentication.principal.username}">email</span></p>

                    <a href="/Sportline/client/modifier-profil" class="btn btn-primary w-100">
                        Modifier mon profil
                    </a>
                </div>
            </div>
        </div>

        <!-- Historique des commandes -->
        <div class="col-md-8">
            <div class="card shadow-sm mb-3">
                <div class="card-body">
                    <h5 class="card-title">Mes commandes</h5>

                    <!-- Liste des commandes -->
                    <div th:if="${commandes != null and !commandes.isEmpty()}">

                        <table class="table table-striped">
                            <thead>
                            <tr>
                                <th>Numéro</th>
                                <th>Date</th>
                                <th>Total</th>
                                <th>Statut</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="commande : ${commandes}">
                                <td th:text="${commande.id}"></td>
                                <td th:text="${commande.date}"></td>
                                <td th:text="${commande.total} + ' €'"></td>
                                <td th:text="${commande.paiement.statut}"></td>
                            </tr>
                            </tbody>
                        </table>

                    </div>

                    <p class="text-muted" th:if="${commandes == null or commandes.isEmpty()}">
                        Vous n'avez pas encore passé de commande.
                    </p>

                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
