<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription - SportLine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background: #f5f9ff;
            font-family: 'Poppins', sans-serif;
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            color: #0072ce;
            margin-bottom: 30px;
            text-align: center;
        }
        .register-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            margin: 50px auto;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .form-control {
            border-radius: 12px;
            border: 1px solid #0072ce;
            padding: 12px;
        }
        .btn-register {
            background: linear-gradient(135deg,#ff7b00,#ffa040);
            color: white;
            font-weight: 600;
            border-radius: 25px;
            padding: 10px 25px;
            border: none;
            transition: all 0.3s;
            width: 100%;
        }
        .btn-register:hover {
            background: linear-gradient(135deg,#ffa040,#ffb066);
            transform: translateY(-2px);
        }
        .error-msg {
            color: red;
            font-size: 0.9rem;
            display: none;
            margin-top: 5px;
        }
        .success-msg {
            color: green;
            font-size: 1rem;
            text-align: center;
            display: none;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<h1>Inscription SportLine</h1>

<div class="register-container">
    <div class="success-msg" id="success-msg">Inscription réussie !</div>
    <form id="registerForm" action="/Sportline/register" method="post">
        <div class="mb-3">
            <label for="firstName" class="form-label">Prénom</label>
            <input type="text" id="firstName" name="firstName" class="form-control" required>
            <div class="error-msg" id="error-firstName">Veuillez entrer votre prénom.</div>
        </div>
        <div class="mb-3">
            <label for="lastName" class="form-label">Nom</label>
            <input type="text" id="lastName" name="lastName" class="form-control" required>
            <div class="error-msg" id="error-lastName">Veuillez entrer votre nom.</div>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" name="email" class="form-control" required>
            <div class="error-msg" id="error-email">Veuillez entrer un email valide.</div>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Mot de passe</label>
            <input type="password" id="password" name="password" class="form-control" required>
            <div class="error-msg" id="error-password">Le mot de passe doit contenir au moins 6 caractères.</div>
        </div>
        <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirmer le mot de passe</label>
            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required>
            <div class="error-msg" id="error-confirmPassword">Les mots de passe ne correspondent pas.</div>
        </div>
        <button type="submit" class="btn-register">S'inscrire</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const form = document.getElementById('registerForm');
    form.addEventListener('submit', function(e) {
        e.preventDefault();

        // Reset messages
        document.querySelectorAll('.error-msg').forEach(el => el.style.display='none');
        const firstName = document.getElementById('firstName').value.trim();
        const lastName = document.getElementById('lastName').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        let valid = true;

        if(!firstName){ document.getElementById('error-firstName').style.display='block'; valid=false; }
        if(!lastName){ document.getElementById('error-lastName').style.display='block'; valid=false; }
        if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ document.getElementById('error-email').style.display='block'; valid=false; }
        if(password.length < 6){ document.getElementById('error-password').style.display='block'; valid=false; }
        if(password !== confirmPassword){ document.getElementById('error-confirmPassword').style.display='block'; valid=false; }

        if(valid){
            // Ici, tu peux envoyer le formulaire via fetch/ajax ou le laisser faire action POST
            document.getElementById('success-msg').style.display='block';
            form.reset();
        }
    });
</script>

</body>
</html>
