<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <style>
        nav.navbar { background-color: #0072ce; box-shadow: 0 0 15px #00f0ff; transition: all 0.3s; }
        nav.navbar .navbar-brand { font-weight:bold; text-shadow:0 0 8px #00f0ff; font-size:1.8rem; color:#00f0ff; }
        nav.navbar .navbar-brand:hover { text-shadow:0 0 15px #80f0ff; transform:translateY(-2px); }
        nav.navbar .nav-link { color:white; font-weight:500; margin-right:15px; transition:all 0.3s; }
        nav.navbar .nav-link:hover { text-shadow:0 0 12px #00f0ff; transform:translateY(-2px); color:#00f0ff !important; }
        .nav-link.promo { color:#ff00ff; text-shadow:0 0 5px #ff00ff; }
        .nav-link.promo:hover { text-shadow:0 0 12px #ff80ff; }
        .nav-link.login { color:#00ff00; text-shadow:0 0 5px #00ff00; }
        .nav-link.login:hover { text-shadow:0 0 12px #80ff80; }
        .neon-btn { border:1px solid #00f0ff; color:#00f0ff; background:transparent; text-shadow:0 0 5px #00f0ff; padding:4px 10px; border-radius:5px; font-size:0.9rem; transition:all 0.3s; }
        .neon-btn:hover { background:#00f0ff; color:#000; text-shadow:0 0 12px #00f0ff; transform:translateY(-2px); }
        nav.navbar .nav-link:focus { outline:2px solid #00f0ff; outline-offset:2px; }
        .navbar-toggler { border-color:#00f0ff; }
        .navbar-toggler-icon { background-image: url("data:image/svg+xml;charset=utf8,%3Csvg viewBox='0 0 30 30' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath stroke='rgba%280,240,255,1%29' stroke-width='2' stroke-linecap='round' stroke-miterlimit='10' d='M4 7h22M4 15h22M4 23h22'/ %3E%3C/svg%3E"); }
    </style>
</head>
<body>
<div th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">SportLine</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" th:href="@{/Sportline/a-propos}">À propos</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/Sportline/produits}">Produits</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/Sportline/contact}">Contact</a></li>

                    <li sec:authorize="hasRole('ADMIN')" class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="adminMenu" role="button" data-bs-toggle="dropdown"
                           aria-expanded="false">Administration</a>
                        <ul class="dropdown-menu" aria-labelledby="adminMenu">
                            <li><a class="dropdown-item" th:href="@{/Sportline/admin/categories}">Catégories</a></li>
                            <li><a class="dropdown-item" th:href="@{/Sportline/admin/produits}">Produits</a></li>
                        </ul>
                    </li>

                    <li sec:authorize="isAnonymous()" class="nav-item"><a class="nav-link promo" th:href="@{/Sportline/inscription}">S'inscrire</a></li>
                    <li sec:authorize="isAnonymous()" class="nav-item"><a class="nav-link login" th:href="@{/login}">Login</a></li>

                    <li sec:authorize="isAuthenticated()" class="nav-item">
                        <form action="/Sportline/logout" method="post" class="d-inline">
                            <button class="neon-btn" type="submit">Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</div>
</body>
</html>
